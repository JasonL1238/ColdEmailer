# Baseline secret scan on push/PR. For stronger scanning, add gitleaks/trufflehog.
name: Secret scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed secret files
        run: |
          for f in .env .env.local credentials.json token.json; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::Sensitive file is tracked: $f. Add to .gitignore and remove from history."
              exit 1
            fi
          done
          echo "No sensitive filenames tracked in repo."

      - name: Scan for high-entropy / key-like patterns
        run: |
          # Fail if tracked files contain obvious secret patterns (no full secrets printed)
          if git grep -E 'sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}' -- '*.py' '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.yml' '*.yaml' 2>/dev/null; then
            echo "::error::Possible API key or token pattern found in code. Remove or use env vars."
            exit 1
          fi
          if git grep -l '-----BEGIN.*PRIVATE KEY-----' -- . 2>/dev/null; then
            echo "::error::Possible private key file committed. Remove from repo."
            exit 1
          fi
          echo "No key-like patterns found in tracked files."
